name: Pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close with a note
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --comment \
            "Thanks for the change, but this repository does not take pull requests. It is a fixed exercise: keep your work on your own clone, nothing needs to come back here."
